services:
  # Backend Service
  - type: web
    name: ai-support-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false # You will enter this in the Render Dashboard

  # Frontend Service (Static Site)
  - type: web
    name: ai-support-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ai-support-backend
          type: web
          property: host
